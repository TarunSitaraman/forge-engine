name: release

# Publishes to PyPI when a version tag is pushed, and never otherwise. The
# version in the tag must match the version in pyproject: a mismatch is how a
# release gets cut from the wrong commit, so it fails the job rather than
# uploading something nobody meant to.
on:
  push:
    tags: ["v*"]
  # Available by hand for a dry run: builds and checks, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the tag against the version in pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tagged pyproject=$declared"
          test "$tagged" = "$declared"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # The wheel is what users get, so the wheel is what gets tested: install
      # it on its own and run the demo, which exits non-zero if the engine
      # stops finding one of its planted defects.
      - name: Install the wheel alone and run the demo
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP" && /tmp/release-check/bin/forge demo --path ./demo-vault

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored in the repository, in a secret, or on anyone's
    # laptop. There is no credential here to leak or rotate.
    environment:
      name: pypi
      url: https://pypi.org/p/forge-kb
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run after a partial failure must not die on "file already
          # exists". The upload is the irreversible step, so the job has to be
          # safe to run twice; without this, fixing anything downstream of it
          # costs a version number.
          skip-existing: true

      # The notes are the changelog entry for this version, read out of
      # CHANGELOG.md rather than generated from commit subjects. The entry was
      # written deliberately and says what changed and why; a list of commit
      # titles is what you get when nobody wrote one.
      - name: Take the notes from the changelog
        run: |
          python - <<'EOF' > release-notes.md
          import pathlib, re, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # From this version's heading to the next one at the same level.
          match = re.search(
              rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          body = match.group(1).strip() if match else ""
          print(body or f"See CHANGELOG.md for {version}.")
          EOF
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
