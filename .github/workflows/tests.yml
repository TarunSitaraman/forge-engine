name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject (>=3.10) and a current release.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # No secrets, no network, no model. The 42 vault-dependent tests skip
      # unless FORGE_TEST_VAULT points at a corpus, which CI deliberately does
      # not set -- the vault is a separate private repository.
      - name: Test
        run: python -m pytest tests
