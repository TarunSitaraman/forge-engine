    query: technique for finding the best contiguous subarray without recomputing
    relevant:
      - DSA/01_Patterns/Sliding Window.md
      - DSA/09_CheatSheets/Sliding Window Cheat Sheet.md

  - id: fuzzy-disjoint-sets
