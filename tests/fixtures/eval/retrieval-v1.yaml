      - DSA/03_DataStructures/Disjoint Set.md

  - id: fuzzy-grounding-llm
    category: fuzzy_concept
    query: stopping a language model from making things up by giving it real passages
    relevant:
      - Technologies/Docs/rag.md

  - id: fuzzy-similarity-index
    category: fuzzy_concept
    query: storing numeric representations of text so similar things can be found
    relevant:
      - Technologies/Docs/vector-databases.md

  - id: fuzzy-task-ordering
    category: fuzzy_concept
    query: ordering tasks so every prerequisite comes before what depends on it
    relevant:
      - DSA/01_Patterns/Topological Sort.md

