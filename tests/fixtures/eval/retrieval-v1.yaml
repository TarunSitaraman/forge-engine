# Forge retrieval evaluation set — v1
#
# An INTERNAL evaluation fixture, not a benchmark platform. Its only job is to
# let Forge answer "did this retrieval change help?" with a number instead of
# an opinion.
#
# ---------------------------------------------------------------------------
# HOW THESE QUERIES WERE SELECTED
# ---------------------------------------------------------------------------
#
# Every query is a question this corpus's owner would plausibly ask it, drawn
# from the six categories Phase 3 requires. They were chosen as follows:
#
# 1. `exact_concept`  — the canonical name of a page that exists. Tests that
#    naming a thing retrieves that thing. Trivially easy on purpose: a
#    retrieval system failing these is broken, so they are the floor.
#
# 2. `fuzzy_concept`  — the same idea phrased as a user would say it, never
#    using the page's exact title. This is where lexical retrieval is expected
#    to struggle and where semantic retrieval, if it helps at all, should show
#    it.
#
# 3. `related_concept` — a query whose answer spans several pages that are
#    conceptually linked but do not share a title. Tests breadth.
#
# 4. `dsa` / `technology` / `project` — domain questions against the three
#    substantial sections of the corpus.
#
# RELEVANCE LABELS were assigned by locating documents that actually contain a
# substantive treatment of the query's subject — verified by reading the file,
# not by keyword count. A file that merely mentions a term in a link list is
# NOT relevant. Where a judgement was close, the file was left out: a smaller,
# defensible label set produces honest metrics, whereas padding relevance
# inflates recall for free.
#
# `relevant` paths are vault-relative and must exist. `scripts/eval_check.py`
# verifies that, so a corpus reorganization cannot silently rot this file into
# meaninglessness.
#
# NOT DONE HERE: tuning any retrieval parameter against these labels. The set
# exists to measure, and measuring against a set you optimized on measures
# nothing.

version: 1
corpus: forge-vault
unit: source          # relevance is judged per source document, not per span

queries:
  # ----------------------------------------------------- exact concept lookup
  - id: exact-sliding-window
    category: exact_concept
    query: Sliding Window
    relevant:
      - DSA/01_Patterns/Sliding Window.md
      - DSA/09_CheatSheets/Sliding Window Cheat Sheet.md
      - DSA/07_Interview/Sliding Window Interview Guide.md

  - id: exact-union-find
