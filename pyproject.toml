[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `forge-engine` was taken on PyPI by an unrelated, actively maintained project
# (a terminal AI harness, last released 2026-08-03), so the distribution name
# differs from the GitHub repository name. The import package and the console
# script stay `forge`; PyPI's `forge` is a Django scaffolder, and the overlap
# between its users and this tool's is close enough to zero to accept.
name = "forge-kb"
version = "0.1.0"
description = "A knowledge engine for Markdown vaults: traceable claims with provenance, a graph you can question, and a record of how your understanding changed."
readme = "README.md"
authors = [{ name = "Tarun Sitaraman", email = "tarunsitaraman134@gmail.com" }]
keywords = [
    "markdown",
    "obsidian",
    "knowledge-base",
    "wikilinks",
    "frontmatter",
    "linter",
    "static-analysis",
    "zettelkasten",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# The floor is 3.10: the domain models use PEP 604 unions (`str | None`) which
# pydantic evaluates at runtime, so 3.9 and below genuinely cannot load them.
# 3.10 is also materially easier to obtain on older systems than 3.11.
#
# This line previously carried "Verified on 3.10, 3.11, 3.12, and 3.13, the
# full suite passes on each", and that was not true. It was written when the
# floor was lowered from 3.11 without running 3.10, and `storage/backup.py`
# had `from datetime import UTC`, which is 3.11 and later. `pip install
# forge-kb` on 3.10 therefore succeeded and then failed on the first import.
# CI ran only 3.10, so the badge had been red since. Fixed 2026-09-08, and CI
# now runs the floor and the ceiling rather than one version.
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately minimal. Every dependency below is load-bearing:
#   pydantic  — typed domain models + validation + serialization
#   typer     — CLI (and `forge shell`, which uses its group as the command list)
#   structlog — structured logging
#   PyYAML    — frontmatter parsing (the corpus is YAML-frontmattered)
#   httpx     — Ollama and cloud HTTP transport
#   pypdfium2 — PDF text extraction (Apache/BSD; chosen over AGPL PyMuPDF)
# Storage uses stdlib sqlite3. Markdown parsing is stdlib `re` (see
# docs/architecture/phase-1-implementation.md for why, not laziness).
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
# LangGraph orchestrates the Phase 4 knowledge-evolution workflow. It is an
# extra, not a core dependency, because indexing, ingestion, retrieval,
# activation, and the graph must keep working without it — `forge index` on a
# fresh clone must not require an orchestration framework.
agent = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0"]
# `forge tui` — the full-screen interface. An extra for the same reason as
# `agent`: a terminal UI is not load-bearing for indexing a vault, and
# `forge shell` offers every command with nothing beyond the standard library
# and what typer already brings.
tui = ["textual>=1.0"]
# `forge serve` — the read-only HTTP API and graph explorer. An extra for the
# same reason as the others: the API is a *view* over the store, and every
# command that builds the store must keep working without a web framework
# installed. `forge.api` is imported lazily so a missing FastAPI is a clear
# message from one command rather than an ImportError at startup.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# `forge mcp` — the same read-only queries, exposed to an agent over MCP. A
# separate extra from `api` on purpose: someone wiring Forge into an agent has
# no reason to install a web server, and someone browsing the explorer has no
# reason to install an agent SDK.
mcp = ["mcp>=2.0"]
# Static word vectors, for measuring whether *semantic* matching beats
# vocabulary overlap. An extra for the same reason as the others: retrieval
# must work with no model at all, and `hashing` remains the zero-dependency
# path. The model itself is a separate install and ships from GitHub releases:
#   pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl
vectors = ["spacy>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # CI lints with this. It was missing until 2026-09-08, so the lint job it
    # was added for failed on `ruff: command not found`.
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "textual>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.scripts]
forge = "forge.cli.main:app"

[project.urls]
Homepage = "https://github.com/TarunSitaraman/forge-engine"
Repository = "https://github.com/TarunSitaraman/forge-engine"
Issues = "https://github.com/TarunSitaraman/forge-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["engine/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine"]
addopts = "-q"
markers = [
    "requires_model: test needs a live local LLM (skipped by default; CI runs without models)",
]

[tool.ruff]
line-length = 100
# Must match `requires-python` above, and did not: it said py311 while the
# package declared 3.10. That is how `from datetime import UTC` reached
# `storage/backup.py` (UP017 rewrites `timezone.utc` to it, and at py311 ruff
# believes that is safe), and the package then failed to import on the very
# version it claimed as its floor. Raising this without raising the floor
# licenses the same bug again.
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# E402, imports below the top of the file. Both cases here are deliberate and
# the alternative is worse than the rule.
#
#   main.py registers the later phases' commands by calling into their modules,
#   and it does so *after* defining its own, so Phase 1's commands keep their
#   position in the help and their order in the group the shell enumerates.
#
#   The optional-extra tests guard their imports with `pytest.importorskip`, so
#   the whole module skips when the extra is absent instead of failing to
#   collect. That call has to run before the import it protects.
"engine/forge/cli/main.py" = ["E402"]
"tests/unit/test_api.py" = ["E402"]
"tests/unit/test_mcp.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a call in an argument default, which is
# what B008 exists to catch in ordinary code. These four are the documented
# idiom and are evaluated once at import, so the mutable-default hazard the
# rule guards against does not apply.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    # Typer's is the same idiom, and every CLI command in this package uses it.
    "typer.Option",
    "typer.Argument",
]
