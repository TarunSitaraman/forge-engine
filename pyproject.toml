[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `forge-engine` was taken on PyPI by an unrelated, actively maintained project
# (a terminal AI harness, last released 2026-08-03), so the distribution name
# differs from the GitHub repository name. The import package and the console
# script stay `forge`; PyPI's `forge` is a Django scaffolder, and the overlap
# between its users and this tool's is close enough to zero to accept.
name = "forge-kb"
version = "0.1.0"
description = "Find what is quietly broken in a Markdown knowledge vault: dead wikilinks, missing frontmatter, contradictory conventions."
readme = "README.md"
authors = [{ name = "Tarun Sitaraman", email = "tarunsitaraman134@gmail.com" }]
keywords = [
    "markdown",
    "obsidian",
    "knowledge-base",
    "wikilinks",
    "frontmatter",
    "linter",
    "static-analysis",
    "zettelkasten",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Verified on 3.10, 3.11, 3.12, and 3.13 — the full suite passes on each.
# The real floor is 3.10: the domain models use PEP 604 unions (`str | None`)
# which pydantic evaluates at runtime, so 3.9 and below genuinely cannot load
# them. The floor was previously declared as 3.11, which made pip refuse an
# install that works, and 3.10 is materially easier to obtain on older systems.
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately minimal. Every dependency below is load-bearing:
#   pydantic  — typed domain models + validation + serialization
#   typer     — CLI (and `forge shell`, which uses its group as the command list)
#   structlog — structured logging
#   PyYAML    — frontmatter parsing (the corpus is YAML-frontmattered)
#   httpx     — Ollama and cloud HTTP transport
#   pypdfium2 — PDF text extraction (Apache/BSD; chosen over AGPL PyMuPDF)
# Storage uses stdlib sqlite3. Markdown parsing is stdlib `re` (see
# docs/architecture/phase-1-implementation.md for why, not laziness).
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
# LangGraph orchestrates the Phase 4 knowledge-evolution workflow. It is an
# extra, not a core dependency, because indexing, ingestion, retrieval,
# activation, and the graph must keep working without it — `forge index` on a
# fresh clone must not require an orchestration framework.
agent = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0"]
# `forge tui` — the full-screen interface. An extra for the same reason as
# `agent`: a terminal UI is not load-bearing for indexing a vault, and
# `forge shell` offers every command with nothing beyond the standard library
# and what typer already brings.
tui = ["textual>=1.0"]
# Static word vectors, for measuring whether *semantic* matching beats
# vocabulary overlap. An extra for the same reason as the others: retrieval
# must work with no model at all, and `hashing` remains the zero-dependency
# path. The model itself is a separate install and ships from GitHub releases:
#   pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl
vectors = ["spacy>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "textual>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.scripts]
forge = "forge.cli.main:app"

[project.urls]
Homepage = "https://github.com/TarunSitaraman/forge-engine"
Repository = "https://github.com/TarunSitaraman/forge-engine"
Issues = "https://github.com/TarunSitaraman/forge-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["engine/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine"]
addopts = "-q"
markers = [
    "requires_model: test needs a live local LLM (skipped by default; CI runs without models)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
